[layout]
sidebar = true
emoji = true

[listings]
pageHeader = 'title' # none, title

[directoryUI.search]
placeholder = "Rechercher parmi les {0} ressources"
showCount = true
icon = "tabler:search"

[directoryUI.search.tags]
display = "show-all" # options: none,select,show-all
intersection = false

[directoryUI.grid]
list = false
type = "rectangle-card-grid" # options: icon-list, small-card-grid, rectangle-card-grid

[directoryUI.grid.emptyState]
text = "Aucune ressources ne correspond à cette recherche."
type = "button"    # options: button, simple, link
icon = "tabler:exclamation-mark"

[directoryUI.grid.card]
image = true

[directoryUI.grid.submit]
show = true
first = false
title = "Proposer une ressource"
description = "Vous connaissez une ressource francophone sur le test logiciel qui manque à l'annuaire ? Proposez-la !"
hideable = true

[directoryUI.featured]
showOnAllPages = true
showOnSide = true
icon = "tabler:star"
labelForCard = "À la une ✨"

[directoryUI.paid]
icon = "tabler:cash"
labelForCard = "Payant 💶"

[directoryUI.status.inactive]
labelForCard = "Inactif ⏸️"

[directoryUI.status.closed]
labelForCard = "Fermé 🔒"

[ui.icons]
dark = "tabler:moon"
light = "tabler:sun"
youtube = "tabler:brand-youtube"
x = "tabler:brand-twitter"
instagram = "tabler:brand-instagram"
facebook = "tabler:brand-facebook"
github = "tabler:brand-github"
