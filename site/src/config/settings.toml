theme = 'portail'

[general]
title = "Le Portail du Test Logiciel Francophone"
logo = ""
iconLogo = "tabler:flask"

[general.seo]
name = "Le Portail du Test Logiciel Francophone"
description = "Le portail des ressources francophones du test logiciel : blogs, podcasts, newsletters, magazines, communautés, événements, emploi, études et formations, livres."
url = "https://le-portail-du-test.fr"

[directoryData.source]
name = "default" # default, mock, sheets, json
links = "normal"

[directoryData.tagPages]
title = "{0}"

[directoryData.search]
placeholder = "Rechercher parmi les {0} fiches de l'annuaire"

[[directoryData.tags]]
key = "blogs"
name = "Blogs"
color = "green"
emoji = "✍️"
description = "Blogs francophones de référence sur le test logiciel et la qualité."

[[directoryData.tags]]
key = "communautes"
name = "Communautés"
color = "blue"
emoji = "👥"
description = "Communautés et meetups francophones des professionnels du test."

[[directoryData.tags]]
key = "emploi"
name = "Emploi"
color = "teal"
emoji = "💼"
description = "Offres d'emploi et opportunités dans le test logiciel et l'assurance qualité."

[[directoryData.tags]]
key = "etudes-formations"
name = "Études et formations"
color = "indigo"
emoji = "🎓"
description = "Études et formations pour apprendre et monter en compétences sur le test logiciel."

[[directoryData.tags]]
key = "evenements"
name = "Événements"
color = "red"
emoji = "📅"
description = "Événements et conférences francophones dédiés au test logiciel."

[[directoryData.tags]]
key = "livres"
name = "Livres"
color = "cyan"
emoji = "📚"
description = "Livres et ouvrages francophones de référence sur le test logiciel et la qualité."

[[directoryData.tags]]
key = "magazines"
name = "Magazines"
color = "amber"
emoji = "📖"
description = "Magazines et publications francophones consacrés au test logiciel et à la qualité."

[[directoryData.tags]]
key = "newsletters"
name = "Newsletters"
color = "purple"
emoji = "📬"
description = "Newsletters francophones pour faire sa veille sur le test logiciel."

[[directoryData.tags]]
key = "podcasts"
name = "Podcasts"
color = "orange"
emoji = "🎧"
description = "Podcasts francophones consacrés au test logiciel et à l'assurance qualité."

[header.banner]
show = false
text = ""
link = "https://le-portail-du-test.fr"
brandText = "Le Portail du test logiciel"

[header.navbar]
colorModeSelector = true
links = []

[header.actionButton]
text = "Proposer une ressource"
href = "https://github.com/apallier/leportaildutest.fr/issues/new?title=%5BAjout%5D"

[footer]
description = "Le Portail du test logiciel : le portail des ressources francophones du test logiciel."

[footer.socials.github]
link = "https://github.com/apallier/leportaildutest.fr"
