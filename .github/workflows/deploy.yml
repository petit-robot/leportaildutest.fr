name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment/job can run at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  linkcheck:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SITE: https://leportaildutest.fr/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: atest/requirements.txt
      - name: Install link check dependencies
        run: pip install -r atest/requirements.txt
      - name: Wait for the deployment to be served
        run: |
          for attempt in $(seq 30); do
            if curl -sSf -o /dev/null -H 'Cache-Control: no-cache' "$SITE"; then
              echo "$SITE answered after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::$SITE did not answer in time"
          exit 1
      # --file-output takes TYPE/ENCODING/FILENAME, so the report below is an
      # html one, encoded in utf-8, written to atest/results/deployed-links.html.
      - name: Check the links of the deployed site
        id: linkcheck
        continue-on-error: true
        run: |
          mkdir -p atest/results
          linkchecker --config=atest/linkcheckerrc \
            --file-output=html/utf-8/atest/results/deployed-links.html \
            "$SITE"
      - name: Warn about the broken links
        if: steps.linkcheck.outcome == 'failure'
        run: |
          echo "::warning::linkchecker reported broken links, see the deployed-link-check artifact"
      - name: Publish the link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-link-check
          path: atest/results
